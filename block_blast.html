<!DOCTYPE html>
<html>
<head>
    <title>Block Blast</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 500px;
            background-color: #111;
            border: 2px solid #444;
            overflow: hidden;
        }
        #player {
            position: absolute;
            width: 60px;
            height: 20px;
            background-color: #4CAF50;
            bottom: 20px;
            left: 170px;
            border-radius: 5px;
        }
        .ball {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #f44336;
            border-radius: 50%;
        }
        .block {
            position: absolute;
            width: 60px;
            height: 20px;
            background-color: #2196F3;
            border-radius: 3px;
        }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 18px;
        }
        #start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #start-button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        #game-over {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #restart-button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="player"></div>
        <div id="score">Score: 0</div>
        
        <div id="start-screen">
            <h1>BLOCK BLAST</h1>
            <p>Используйте мышку или стрелки ← → для движения</p>
            <button id="start-button">START GAME</button>
        </div>
        
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p id="final-score">Score: 0</p>
            <button id="restart-button">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game elements
        const gameContainer = document.getElementById('game-container');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        
        // Game variables
        let playerX = 170;
        let ball = null;
        let ballX = 0;
        let ballY = 0;
        let ballSpeedX = 3;
        let ballSpeedY = -3;
        let blocks = [];
        let score = 0;
        let gameRunning = false;
        let mouseX = 0;
        
        // Create blocks
        function createBlocks() {
            const rows = 5;
            const cols = 6;
            const blockWidth = 60;
            const blockHeight = 20;
            const gap = 5;
            const offsetTop = 30;
            const offsetLeft = (gameContainer.offsetWidth - (cols * (blockWidth + gap))) / 2;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const block = document.createElement('div');
                    block.className = 'block';
                    block.style.left = (offsetLeft + c * (blockWidth + gap)) + 'px';
                    block.style.top = (offsetTop + r * (blockHeight + gap)) + 'px';
                    
                    // Different colors for different rows
                    if (r === 0) block.style.backgroundColor = '#FF5722';
                    else if (r === 1) block.style.backgroundColor = '#FFC107';
                    else if (r === 2) block.style.backgroundColor = '#9C27B0';
                    else if (r === 3) block.style.backgroundColor = '#3F51B5';
                    
                    gameContainer.appendChild(block);
                    blocks.push({
                        element: block,
                        x: offsetLeft + c * (blockWidth + gap),
                        y: offsetTop + r * (blockHeight + gap),
                        width: blockWidth,
                        height: blockHeight,
                        active: true
                    });
                }
            }
        }
        
        // Create ball
        function createBall() {
            if (ball) gameContainer.removeChild(ball);
            
            ball = document.createElement('div');
            ball.className = 'ball';
            ballX = playerX + 30 - 7.5;
            ballY = 480;
            ball.style.left = ballX + 'px';
            ball.style.top = ballY + 'px';
            gameContainer.appendChild(ball);
            
            ballSpeedX = 3 * (Math.random() > 0.5 ? 1 : -1);
            ballSpeedY = -3;
        }
        
        // Start game
        function startGame() {
            // Reset game state
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            blocks.forEach(block => {
                if (block.element.parentNode) gameContainer.removeChild(block.element);
            });
            blocks = [];
            
            // Create game elements
            createBlocks();
            createBall();
            
            // Hide start screen
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Start game loop
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }
        
        // Game over
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = 'Score: ' + score;
            gameOverScreen.style.display = 'flex';
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            // Move player
            playerX = mouseX - 30;
            if (playerX < 0) playerX = 0;
            if (playerX > 340) playerX = 340;
            player.style.left = playerX + 'px';
            
            // Move ball
            ballX += ballSpeedX;
            ballY += ballSpeedY;
            ball.style.left = ballX + 'px';
            ball.style.top = ballY + 'px';
            
            // Ball collision with walls
            if (ballX <= 0 || ballX >= 385) {
                ballSpeedX = -ballSpeedX;
            }
            if (ballY <= 0) {
                ballSpeedY = -ballSpeedY;
            }
            
            // Ball collision with player
            if (ballY + 15 >= 480 && ballY + 15 <= 500 && 
                ballX + 15 >= playerX && ballX <= playerX + 60) {
                ballSpeedY = -ballSpeedY;
                // Add some angle based on where ball hits the paddle
                const hitPosition = (ballX + 7.5) - (playerX + 30);
                ballSpeedX = hitPosition * 0.15;
            }
            
            // Ball out of bounds (game over)
            if (ballY > 500) {
                gameOver();
                return;
            }
            
            // Ball collision with blocks
            for (let i = 0; i < blocks.length; i++) {
                const block = blocks[i];
                if (!block.active) continue;
                
                if (ballX + 15 >= block.x && ballX <= block.x + block.width &&
                    ballY + 15 >= block.y && ballY <= block.y + block.height) {
                    
                    // Determine which side was hit
                    const ballCenterX = ballX + 7.5;
                    const ballCenterY = ballY + 7.5;
                    const blockCenterX = block.x + block.width / 2;
                    const blockCenterY = block.y + block.height / 2;
                    
                    const dx = ballCenterX - blockCenterX;
                    const dy = ballCenterY - blockCenterY;
                    const width = block.width / 2 + 7.5;
                    const height = block.height / 2 + 7.5;
                    const crossWidth = width * dy;
                    const crossHeight = height * dx;
                    
                    if (Math.abs(dx) <= width && Math.abs(dy) <= height) {
                        // Collision detected
                        block.active = false;
                        gameContainer.removeChild(block.element);
                        score += 10;
                        scoreDisplay.textContent = 'Score: ' + score;
                        
                        if (crossWidth > crossHeight) {
                            ballSpeedY = -ballSpeedY;
                        } else {
                            ballSpeedX = -ballSpeedX;
                        }
                        
                        break;
                    }
                }
            }
            
            // Check win condition
            if (blocks.every(block => !block.active)) {
                // All blocks destroyed - next level
                createBlocks();
                createBall();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // Event listeners
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        
        // Mouse movement
        gameContainer.addEventListener('mousemove', (e) => {
            const rect = gameContainer.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                mouseX -= 20;
                if (mouseX < 0) mouseX = 0;
            } else if (e.key === 'ArrowRight') {
                mouseX += 20;
                if (mouseX > 400) mouseX = 400;
            }
        });
    </script>
</body>
</html>
